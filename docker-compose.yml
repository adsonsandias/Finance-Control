services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finance_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - finance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finance_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_SUPABASE_URL=http://localhost:3001
      - REACT_APP_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

  # Simple Backend API (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finance_backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/postgres
      - JWT_SECRET=your-super-secret-jwt-token-with-at-least-32-characters-long
      - PORT=3001
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  storage_data:

networks:
  finance_network:
    driver: bridge