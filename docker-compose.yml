services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finance_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - finance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Auth Module
  frontend-auth:
    build:
      context: ./frontend/auth
      dockerfile: Dockerfile
    container_name: finance_frontend_auth
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend/auth/src:/app/src
      - ./frontend/auth/public:/app/public
      - ./shared:/app/shared
      - /app/node_modules
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

  # Frontend Dashboard Module
  frontend-dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: finance_frontend_dashboard
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend/dashboard/src:/app/src
      - ./frontend/dashboard/public:/app/public
      - ./shared:/app/shared
      - /app/node_modules
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: finance_backend
    ports:
      - "3002:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend/src:/app/src
      - ./shared:/app/shared
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  storage_data:

networks:
  finance_network:
    driver: bridge