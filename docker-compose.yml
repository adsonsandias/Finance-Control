services:
  # Supabase is used as a service, no need to run it in Docker
  # For local development, you can use Supabase CLI or the cloud version

  # Frontend Auth Module
  frontend-auth:
    build:
      context: ./frontend/auth
      dockerfile: Dockerfile
    container_name: finance_frontend_auth
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend/auth/src:/app/src
      - ./frontend/auth/public:/app/public
      - ./shared:/app/shared
      - /app/node_modules
    networks:
      - finance_network
    depends_on:
      - backend

  # Frontend Dashboard Module
  frontend-dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: finance_frontend_dashboard
    ports:
      - "3003:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend/dashboard/src:/app/src
      - ./frontend/dashboard/public:/app/public
      - ./shared:/app/shared
      - /app/node_modules
    networks:
      - finance_network
    depends_on:
      - backend

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: finance_backend
    ports:
      - "3002:3001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend/src:/app/src
      - ./shared:/app/shared
    networks:
      - finance_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage_data:

networks:
  finance_network:
    driver: bridge