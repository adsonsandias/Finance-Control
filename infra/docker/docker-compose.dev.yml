# Docker Compose para Desenvolvimento
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Supabase - Development overrides
  # Note: In development, we use the Supabase local instance or cloud instance

  # Backend API - Development overrides
  backend:
    environment:
      - SUPABASE_URL=http://localhost:8000
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - JWT_SECRET=development-jwt-secret-not-for-production-use-only
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - /app/node_modules

  # Frontend Auth Module - Development overrides
  frontend-auth:
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - NODE_ENV=development

  # Frontend Mobile Module - Development overrides
  frontend-mobile:
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - NODE_ENV=development
