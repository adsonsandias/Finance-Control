# Docker Compose para o serviço de banco de dados PostgreSQL
# Use: docker-compose -f docker-compose.yml -f docker-compose.db.yml up

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finance_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finance_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

volumes:
  postgres_data:
    driver: local