name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: |
          cd apps/frontend/web && npm run lint
          cd ../mobile && npm run lint
          cd ../../backend && npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: |
          npm run test:web -- --passWithNoTests
          npm run test:mobile -- --passWithNoTests
          npm run test:backend -- --passWithNoTests

  cypress:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          working-directory: apps/frontend/web
          build: npm run build
          start: npm start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120

  build:
    runs-on: ubuntu-latest
    needs: [test, cypress]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            apps/frontend/web/build
            apps/frontend/mobile/build
            apps/backend/dist

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-control-backend:latest
      - name: Build and push frontend-web
        uses: docker/build-push-action@v4
        with:
          context: ./apps/frontend/web
          file: ./apps/frontend/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-control-web:latest
      - name: Build and push frontend-mobile
        uses: docker/build-push-action@v4
        with:
          context: ./apps/frontend/mobile
          file: ./apps/frontend/mobile/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-control-mobile:latest
